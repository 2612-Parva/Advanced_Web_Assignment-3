name: Develop Branch Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Backend tests
        run: |
          cd backend
          npm ci
          npm test

      - name: Frontend tests and lint
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run test
